</head>
<body>
  <a class="ad wait c-a z-320x100 o-h" id="ad" href="javascript:window.open(window.clickTag)"
     style="--w:320px;--h:100px" aria-label="Start a Search — Energy Talent Search">
    <img class="bg" src="assets/photo.jpg" alt="">
    <div class="scrim"></div>
    <div class="safe">
      <span class="logo"><img src="assets/logo.jpg" alt="Energy Talent Search"></span>
      <div class="copy">
        <h1 class="headline"><span class="ln" style="--i:0"><span class="t">Hard-to-fill energy roles?</span></span><span class="ln" style="--i:1"><span class="t">We know <span class="mark" style="--md:1.30s">who to call.</span></span></span></h1>
        <p class="sub">Engineers, field leaders &amp; executives across Oil &amp; Gas, Renewables and Mining.</p>
      </div>
      <span class="cta"><span class="full">Start a Search</span><span class="short">Start a Search</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
  </a>
  <script>
  (function () {
    var END = 9000;
    var ad = document.getElementById('ad');
    var capture = /[?&]capture\b/.test(location.search);
    function anims() { return document.getAnimations ? document.getAnimations() : []; }
    window.__ad = { END: END, seek: function (ms) { anims().forEach(function (a) { a.pause(); a.currentTime = ms; }); } };
    window.__adReady = Promise.all([
      document.fonts ? document.fonts.ready : Promise.resolve(),
      new Promise(function (r) { if (document.readyState === 'complete') r(); else addEventListener('load', r); })
    ]);
    if (capture) return;
    window.__adReady.then(function () {
      ad.classList.remove('wait');
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { window.__ad.seek(END); return; }
      // Google caps HTML5 animation at 30s, so uploaded banners play twice (≈21s) and rest on the end frame.
      // Adding ?loop to the URL (used by the preview page only) makes it loop forever instead.
      var forever = /[?&]loop\b/.test(location.search), plays = 1;
      (function again() {
        if (!forever && plays >= 2) return;
        setTimeout(function () {
          plays++;
          anims().forEach(function (a) { a.currentTime = 0; a.play(); });
          again();
        }, END + 2500);
      })();
    });
  })();
  </script>
